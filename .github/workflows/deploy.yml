name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build JapaneseLearner/JapaneseLearner.csproj --nologo

      - name: Unit tests
        run: dotnet test JapaneseLearner.Tests/JapaneseLearner.Tests.csproj --nologo

      - name: AIOS validators
        shell: pwsh
        run: |
          $fail = @()
          $scripts = @(
            ".opencode/scripts/spec-validator.ps1",
            ".opencode/scripts/constitution-validator.ps1",
            ".opencode/scripts/rules-validator.ps1",
            ".opencode/scripts/glossary-validator.ps1",
            ".opencode/scripts/governance-framework-validator.ps1",
            ".opencode/scripts/manifest-validator.ps1",
            ".opencode/scripts/principles-validator.ps1",
            ".opencode/scripts/workflow-validator.ps1"
          ) + @(Get-ChildItem ".opencode/scripts/spec0*-validator.ps1" | ForEach-Object { $_.FullName })
          foreach ($s in $scripts) {
            Write-Host "=== $s ==="
            & $s
            if ($LASTEXITCODE -ne 0) { $fail += $s }
          }
          if ($fail.Count -gt 0) {
            Write-Host "::error::AIOS validator failed: $($fail -join ', ')"
            exit 1
          }

  deploy:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish JapaneseLearner/JapaneseLearner.csproj -c Release -o release --nologo

      - name: Publish AIHub
        run: dotnet publish AIHub/AIHub.csproj -c Release -o release-aihub --nologo

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll release-aihub/wwwroot/.nojekyll

      - name: Prepare deploy structure
        shell: bash
        run: |
          mkdir -p deploy/JapaneseLearner
          cp -r release/wwwroot/* deploy/JapaneseLearner/
          mkdir -p deploy/AIHub
          cp -r release-aihub/wwwroot/* deploy/AIHub/
          cp -r gh-pages-root/* deploy/
          # Copy hashed blazor.webassembly.<hash>.js to blazor.webassembly.js (.NET 10 omits unhashed copy)
          for f in deploy/JapaneseLearner/_framework/blazor.webassembly.*.js; do
            if [[ "$f" != *".gz" && "$f" != *".br" ]]; then
              cp "$f" deploy/JapaneseLearner/_framework/blazor.webassembly.js
              break
            fi
          done
          # Copy hashed blazor.webassembly.<hash>.js cho AIHub (neu co; AIHub khong dung OverrideHtmlAssetPlaceholders nen giu san ban unhashed)
          for f in deploy/AIHub/_framework/blazor.webassembly.*.js; do
            if [ -e "$f" ] && [[ "$f" != *".gz" && "$f" != *".br" ]]; then
              cp "$f" deploy/AIHub/_framework/blazor.webassembly.js
              break
            fi
          done
          # Set correct base href for GitHub Pages subpath
          sed -i 's|<base href="/" />|<base href="/AIAgent/JapaneseLearner/" />|' deploy/JapaneseLearner/index.html
          sed -i 's|<base href="/" />|<base href="/AIAgent/AIHub/" />|' deploy/AIHub/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
