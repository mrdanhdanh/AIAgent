# AIOS Manifest — package.json của AIOS
# Sprint 0.0 / Milestone 0 — file đầu tiên của toàn bộ Framework.
# Trả lời: AIOS là gì? Tồn tại để làm gì? Giá trị gì? Mục tiêu dài hạn?
# Tham chiếu: SPEC-000 Constitution (Assemble).
---
id: AIOS
name: AI Operating System
version: "1.0.0"
status: draft

mission: >
  Xây nền tảng điều hành cho AI Agent — Runtime là trung tâm,
  Agent chỉ là thành phần chạy trên Runtime.

vision: >
  AIOS trở thành tầng hạ tầng chuẩn để vận hành AI agent
  ở quy mô enterprise, ổn định 5-10 năm, mở rộng qua extension.

scope: >
  Runtime, Agent, Workflow, Registry, Context, Artifact, Event, Scheduler,
  State Machine, Execution, Simulation, Doctor, Evaluation, Evolution,
  Plugin, SDK, Dashboard.

goals:
  - Runtime điều phối mọi hoạt động (P001)
  - Giao tiếp qua Contract, có thể kiểm tra (P002)
  - Mọi object có metadata, machine-readable (P003)
  - Mọi state change phát Event, replay được (P004)
  - Agent stateless, thay thế được (P005)
  - Mở rộng qua Plugin, không sửa core (P010)

non_goals:
  - IDE
  - Source Control
  - Database Engine
  - Chat Platform
  - LLM

quality_attributes:
  - Reliability
  - Scalability
  - Performance
  - Maintainability
  - Extensibility
  - Security
  - Testability
  - Determinism

core_principles:
  - P001 Runtime First
  - P002 Contract First
  - P003 Metadata First
  - P004 Event Driven
  - P005 Stateless Agents
  - P006 Capability Driven
  - P007 Discoverable
  - P008 Observable
  - P009 Versioned
  - P010 Plugin First
  - P011 Simulation Before Execution
  - P012 Single Source of Truth
  - P013 Immutable Artifacts
  - P014 Least Privilege
  - P015 Backward Compatible

owners:
  - core:aios-team

license: proprietary

