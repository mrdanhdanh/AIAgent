    name: Suspended
    category: Active
    type: Active
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-004]
    events: [EXECUTION_SUSPENDED]
  ST-007:
    name: Cancelling
    category: Control
    type: Active
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-010]
    events: [EXECUTION_CANCELLING]
  ST-008:
    name: Completed
    category: Terminal
    type: Terminal
    owner: Runtime
    terminal: true
    retryable: false
    allowed_transitions: [ST-012]
    events: [EXECUTION_COMPLETED]
  ST-009:
    name: Failed
    category: Terminal
    type: Terminal
    owner: Runtime
    terminal: true
    retryable: true
    allowed_transitions: [ST-012, ST-013]
    events: [EXECUTION_FAILED]
  ST-010:
    name: Cancelled
    category: Terminal
    type: Terminal
    owner: Runtime
    terminal: true
    retryable: false
    allowed_transitions: []
