    category: Virtual
    type: Terminal
    owner: Runtime
    terminal: true
    retryable: false
    allowed_transitions: []
    events: [EXECUTION_REPLAYED]
  ST-013:
    name: Retrying
    category: Control
    type: Internal
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-004, ST-009]
    events: [EXECUTION_RETRYING]
  ST-014:
    name: Aborted
    category: Terminal
    type: Terminal
    owner: Runtime
    terminal: true
    retryable: false
    allowed_transitions: []
    events: [EXECUTION_ABORTED]
