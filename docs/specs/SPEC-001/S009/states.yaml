    name: Created
    category: Initial
    type: Initial
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-002]
    events: [EXECUTION_CREATED]
  ST-002:
    name: Validating
    category: Preparation
    type: Internal
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-003, ST-009]
    events: [EXECUTION_VALIDATING]
  ST-003:
    name: Prepared
    category: Preparation
    type: Internal
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-004]
    events: [EXECUTION_PREPARED]
  ST-004:
    name: Running
    category: Active
    type: Active
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-005, ST-006, ST-007, ST-008, ST-009, ST-011, ST-014]
    events: [EXECUTION_STARTED]
  ST-005:
    name: Waiting
    category: Active
    type: Active
    owner: Runtime
    terminal: false
    retryable: false
    allowed_transitions: [ST-004]
    events: [EXECUTION_WAITING]
