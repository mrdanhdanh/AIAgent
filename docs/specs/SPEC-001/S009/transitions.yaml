# SPEC-001 S009 — Transitions v2 (first-class entity)
# Transition: id/from/to/trigger/preconditions/postconditions/generated_events/policy/timeout
---
version: "1.0"
transitions:
  TR-001:
    from: ST-001
    to: ST-002
    trigger: Runtime
    guard: Workflow + Contract hợp lệ
    preconditions: [Execution vừa tạo]
    postconditions: [Validation bắt đầu]
    generated_events: [EXECUTION_VALIDATING]
    policy: -
    timeout: -
  TR-002:
    from: ST-002
    to: ST-003
    trigger: Runtime
    guard: Validation pass
    preconditions: [Validation thành công]
    postconditions: [Context được cấp]
    generated_events: [EXECUTION_PREPARED]
    policy: -
    timeout: -
  TR-003:
    from: ST-002
    to: ST-009
    trigger: Runtime
    guard: Validation fail
    preconditions: [Workflow không hợp lệ]
    postconditions: [Failure Artifact]
    generated_events: [EXECUTION_VALIDATION_FAILED]
    policy: -
    timeout: -
  TR-004:
    from: ST-003
    to: ST-004
    trigger: Runtime
    guard: Simulation pass (P013)
    preconditions: [Execution sẵn sàng]
    postconditions: [Running bắt đầu]
    generated_events: [EXECUTION_STARTED]
    policy: -
    timeout: -
  TR-005:
    from: ST-004
    to: ST-005
    trigger: Approval
    guard: Cần approval/ngoại bộ
    preconditions: [Approval gate kích hoạt]
    postconditions: [Chờ quyết định]
    generated_events: [EXECUTION_WAITING]
    policy: Approval Policy
    timeout: approval_timeout
  TR-006:
    from: ST-005
    to: ST-004
    trigger: Approval
    guard: Approval được duyệt
    preconditions: [Quyết định hợp lệ]
    postconditions: [Tiếp tục chạy]
    generated_events: [EXECUTION_APPROVED]
    policy: Approval Policy
    timeout: -
  TR-007:
    from: ST-004
    to: ST-006
    trigger: User
    guard: Pause theo yêu cầu
    preconditions: [Execution đang chạy]
    postconditions: [Tạm dừng]
    generated_events: [EXECUTION_SUSPENDED]
    policy: -
    timeout: -
  TR-008:
    from: ST-006
    to: ST-004
    trigger: User
    guard: Resume hợp lệ
    preconditions: [Tài nguyên sẵn sàng]
    postconditions: [Tiếp tục chạy]
    generated_events: [EXECUTION_RESUMED]
    policy: -
    timeout: -
  TR-009:
    from: ST-004
    to: ST-007
    trigger: User
    guard: Cancel request hợp lệ
    preconditions: [Yêu cầu hủy]
    postconditions: [Đang hủy]
    generated_events: [EXECUTION_CANCELLING]
    policy: Cancellation Policy
    timeout: cancel_timeout
  TR-010:
    from: ST-007
    to: ST-010
    trigger: Runtime
    guard: Hủy thành công
    preconditions: [Hủy hoàn tất]
    postconditions: [Cancelled Terminal]
    generated_events: [EXECUTION_CANCELLED]
    policy: -
    timeout: -
  TR-011:
    from: ST-004
    to: ST-008
    trigger: Runtime
    guard: Mọi Task/Phase xong
    preconditions: [Tất cả Task hoàn thành]
    postconditions: [Result được publish]
    generated_events: [EXECUTION_COMPLETED]
    policy: -
    timeout: -
  TR-012:
    from: ST-004
    to: ST-009
    trigger: Runtime
    guard: Lỗi không retry được
    preconditions: [Lỗi thực thi]
    postconditions: [Failure Artifact]
    generated_events: [EXECUTION_FAILED]
    policy: Retry Policy
    timeout: -
  TR-013:
    from: ST-004
    to: ST-011
    trigger: Timeout
    guard: Timeout policy
    preconditions: [Vượt thời gian]
    postconditions: [Timeout Artifact]
    generated_events: [EXECUTION_TIMED_OUT]
    policy: Timeout Policy
    timeout: execution_timeout
  TR-014:
    from: ST-004
    to: ST-014
    trigger: Runtime
    guard: System abort
    preconditions: [Lỗi hệ thống]
    postconditions: [Abort Artifact]
    generated_events: [EXECUTION_ABORTED]
    policy: Fail Safe Policy
    timeout: -
  TR-015:
    from: ST-009
    to: ST-013
    trigger: Policy
    guard: retry_count < policy.max_retry
    preconditions: [Lỗi recoverable]
    postconditions: [Chuẩn bị retry]
    generated_events: [EXECUTION_RETRYING]
    policy: Retry Policy
    timeout: retry_timeout
  TR-016:
    from: ST-013
    to: ST-004
    trigger: Scheduler
    guard: Retry attempt
    preconditions: [Retry bắt đầu]
    postconditions: [Chạy lại]
    generated_events: [EXECUTION_RETRIED]
    policy: Retry Policy
    timeout: -
  TR-017:
    from: ST-013
    to: ST-009
    trigger: Policy
    guard: Hết retry
    preconditions: [Retry vượt max]
    postconditions: [Failed Terminal]
    generated_events: [EXECUTION_FAILED]
    policy: Retry Policy
    timeout: -
  TR-018:
    from: ST-008
    to: ST-012
    trigger: Event
    guard: Replay được tạo
    preconditions: [Replay Execution mới]
    postconditions: [Lineage giữ nguyên]
    generated_events: [EXECUTION_REPLAYED]
    policy: Replay Policy
    timeout: -
  TR-019:
    from: ST-009
    to: ST-012
    trigger: Event
    guard: Replay được tạo
    preconditions: [Replay Execution mới]
    postconditions: [Lineage giữ nguyên]
    generated_events: [EXECUTION_REPLAYED]
    policy: Replay Policy
    timeout: -
