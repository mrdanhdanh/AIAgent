# SPEC-001 S002 — Runtime Requirements
# Nguồn dữ liệu chuẩn cho Runtime, Doctor, Dashboard.
# Mỗi requirement có ID duy nhất + phân loại + priority + liên kết Constitution.
---
id: SPEC-001-S002
name: Runtime Requirements
version: "1.0.0"
status: Draft
owner: Runtime Team

# R001 — Functional Requirements
functional:
  FR-001:
    name: Khởi tạo Execution
    description: Runtime khởi tạo Execution Context trước khi chạy.
    priority: Critical
    principles: [P001, P003]
    rules: [RULE-004]
  FR-002:
    name: Nạp Workflow
    description: Runtime nạp Workflow Definition.
    priority: Critical
    principles: [P001, P011]
    rules: [RULE-004]
  FR-003:
    name: Resolve Capability
    description: Runtime resolve Capability qua Registry.
    priority: Critical
    principles: [P007]
    rules: [RULE-002]
  FR-004:
    name: Điều phối Agent
    description: Runtime điều phối Agent theo Capability đã resolve.
    priority: Critical
    principles: [P001, P007]
    rules: [RULE-004]
  FR-005:
    name: Quản lý Context
    description: Runtime quản lý Execution Context (create/read/close).
    priority: Critical
    principles: [P001, P009]
    rules: [RULE-006]
  FR-006:
    name: Quản lý State
    description: Runtime quản lý state trong Execution.
    priority: Critical
    principles: [P001, P005, P009]
    rules: [RULE-005]
  FR-007:
    name: Phát Event
    description: Runtime phát Event cho mọi state change.
    priority: High
    principles: [P005, P014]
    rules: [RULE-007]
  FR-008:
    name: Sinh Artifact
    description: Runtime thu thập và sinh Artifact.
    priority: High
    principles: [P010, P013]
    rules: [RULE-009]
  FR-009:
    name: Thu Metrics
    description: Runtime thu thập Metrics cho observability.
    priority: High
    principles: [P014]
    rules: [RULE-014]
  FR-010:
    name: Hỗ trợ Simulation
    description: Runtime hỗ trợ chạy Simulation trước Execute.
    priority: Medium
    principles: [P013]
    rules: [RULE-004]
  FR-011:
    name: Hỗ trợ Replay
    description: Runtime hỗ trợ Replay Execution từ Event log.
    priority: Medium
    principles: [P005, P013]
    rules: [RULE-013]
  FR-012:
    name: Hỗ trợ Cancellation
    description: Runtime hỗ trợ hủy Execution an toàn.
    priority: Medium
    principles: [P015]
    rules: [RULE-012]

# R002 — Non-functional Requirements
non_functional:
  NFR-001:
    name: Deterministic Execution
    description: Cùng input → cùng output, trong giới hạn định nghĩa.
    priority: Critical
    principles: [P009, P011]
    rules: [RULE-013]
  NFR-002:
    name: Stateless giữa các Execution
    description: Runtime không giữ state giữa hai Execution.
    priority: Critical
    principles: [P001, P006]
    rules: [RULE-005]
  NFR-003:
    name: Metadata Driven
    description: Runtime hoạt động dựa trên metadata, không hardcode.
    priority: Critical
    principles: [P003]
    rules: [RULE-001]
  NFR-004:
    name: Extensible
    description: Runtime mở rộng qua Capability/Plugin, không sửa Core.
    priority: High
    principles: [P012, P019]
    rules: [RULE-010]
  NFR-005:
    name: Observable
    description: Mọi hoạt động sinh Event/Metrics/Logs/Artifacts.
    priority: High
    principles: [P014]
    rules: [RULE-014]
  NFR-006:
    name: Testable
    description: Runtime có thể kiểm thử tự động.
    priority: High
    principles: [P013]
    rules: []
  NFR-007:
    name: Versioned
    description: Mọi object Runtime có version.
    priority: High
    principles: [P004]
    rules: [RULE-009]
  NFR-008:
    name: Recoverable
    description: Runtime có thể phục hồi sau lỗi.
    priority: High
    principles: [P015]
    rules: [RULE-012]

# R003 — Constraints
constraints:
  C-001:
    name: Không chứa Business Logic
    principles: [P001]
    rules: [RULE-001]
  C-002:
    name: Không gọi Agent trực tiếp
    principles: [P001]
    rules: [RULE-004]
  C-003:
    name: Chỉ resolve Capability
    principles: [P007]
    rules: [RULE-002]
  C-004:
    name: Không lưu Context sau Execution
    principles: [P006, P009]
    rules: [RULE-005]
  C-005:
    name: Không sửa Artifact
    principles: [P010]
    rules: [RULE-009]
  C-006:
    name: Không bỏ qua Contract
    principles: [P002]
    rules: [RULE-003]
  C-007:
    name: Không bỏ Event
    principles: [P005, P014]
    rules: [RULE-007]

# R004 — Assumptions
assumptions:
  A-001: Workflow hợp lệ
  A-002: Registry khả dụng
  A-003: Contract hợp lệ
  A-004: Plugin đã validate
  A-005: Agent implement đúng Capability
  note: Nếu giả định sai, Runtime chỉ báo lỗi, không tự sửa.

# R005 — Dependencies (logic, chưa phải module)
dependencies:
  - Glossary
  - Contract
  - Workflow Definition
  - Capability Registry
  - Event Schema

# R006 — External Interfaces
external_interfaces:
  - Workflow Definition
  - Registry
  - Context
  - Event Store
  - Artifact Store
  - Metrics Collector

# R007 — Quality Attributes
quality_attributes:
  Reliability:
    target: Rất cao
    description: Không sập khi Agent lỗi (RULE-012)
  Availability:
    target: Cao
  Scalability:
    target: Cao
  Extensibility:
    target: Rất cao
  Determinism:
    target: 100%
  Traceability:
    target: 100%
  Observability:
    target: 100%
  Maintainability:
    target: Cao

# R008 — Acceptance Requirements
acceptance:
  AR-001: Runtime phải chạy được Workflow hợp lệ.
  AR-002: Runtime phải từ chối Workflow không hợp lệ.
  AR-003: Runtime phải sinh Event đầy đủ.
  AR-004: Runtime phải sinh Artifact.
  AR-005: Runtime phải dừng an toàn khi Agent lỗi.
  AR-006: Runtime không được vi phạm Constitution.
