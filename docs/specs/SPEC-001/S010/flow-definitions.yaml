# SPEC-001 S010 — Flow Definitions (12 flows)
# Moi flow: trigger, steps, states (S009), entities (S008), contracts (S007)
---
version: "1.0"
flows:
  workflow_resolution:
    trigger: Command
    steps: [Workflow Loader nạp, Validate Workflow, Tạo Execution Plan]
    states: [ST-001, ST-002]
    entities: [ENT-001, ENT-004]
    contract: CTR-002
  capability_resolution:
    trigger: Execution Orchestrator
    steps: [Capability Resolver resolve, Registry Resolver lookup, Chọn Agent]
    states: [ST-002, ST-003]
    entities: [ENT-005, ENT-006]
    contract: CTR-004, CTR-005
  context:
    trigger: Execution Manager
    steps: [Context Manager tạo, Cấp cho Agent, Thu hồi sau Execution]
    states: [ST-003]
    entities: [ENT-002]
    contract: CTR-006
  state:
    trigger: Execution Orchestrator
    steps: [State Manager khởi tạo, Theo dõi, Chuyển state, Terminal]
    states: [ST-001..ST-014]
    entities: [ENT-003]
    contract: CTR-007
  event:
    trigger: Mọi state change
    steps: [Event Dispatcher nhận, Validate schema, Publish]
    states: [Mọi transition]
    entities: [ENT-007]
    contract: CTR-008
  artifact:
    trigger: Agent output
    steps: [Artifact Dispatcher nhận, Checksum, Publish metadata]
    states: [ST-004]
    entities: [ENT-008]
    contract: CTR-009
  retry:
    trigger: Policy (retry_count < max)
    steps: [Failed, Retrying, Running]
    states: [ST-009, ST-013, ST-004]
    entities: [ENT-001]
    contract: CTR-001
  timeout:
    trigger: Timeout policy
    steps: [Running, TimedOut, Timeout Artifact]
    states: [ST-004, ST-011]
    entities: [ENT-001]
    contract: CTR-001
  cancellation:
    trigger: User
    steps: [Running, Cancelling, Cancelled]
    states: [ST-004, ST-007, ST-010]
    entities: [ENT-001]
    contract: CTR-001
  approval:
    trigger: Approval gate
    steps: [Running, Waiting, Approved, Running]
    states: [ST-004, ST-005]
    entities: [ENT-001]
    contract: CTR-011 (Policy)
  replay:
    trigger: Event
    steps: [Completed/Failed, Replayed, Tạo Execution mới, Lineage giữ nguyên]
    states: [ST-008/ST-009, ST-012]
    entities: [ENT-001, ENT-014]
    contract: CTR-001
  failure:
    trigger: Runtime (Fail Safe P015)
    steps: [Phát hiện lỗi, Cô lập, Failure Event, Failure Artifact, Rollback/Retry]
    states: [ST-004, ST-009, ST-011, ST-014]
    entities: [ENT-001, ENT-007, ENT-008]
    contract: CTR-001
