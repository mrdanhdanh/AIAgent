# SPEC-001 S010 — End-to-End Flow (EF005)
# Chuoi thuc thi hoan chinh.
---
version: "1.0"
sequence:
  - "User/Command -> Execution Manager (khởi tạo Execution)"
  - "Execution Manager -> Workflow Loader (nạp Workflow)"
  - "Workflow Loader -> Execution Orchestrator (Execution Plan)"
  - "Execution Orchestrator -> Capability Resolver (resolve Capability)"
  - "Capability Resolver -> Registry Resolver (lookup)"
  - "Execution Orchestrator -> Agent (giao Task)"
  - "Agent -> Artifact Dispatcher (bàn giao Artifact)"
  - "Agent -> Event Dispatcher (phát Event)"
  - "Execution Orchestrator -> State Manager (chuyển state)"
  - "Execution Manager -> Result (publish Execution Result)"
  - "Execution Manager -> Archive (lưu trữ)"
