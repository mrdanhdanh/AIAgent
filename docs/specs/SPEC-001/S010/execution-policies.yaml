# SPEC-001 S010 — Execution Policies (EF025) v4
# Moi policy theo cung mot model — SPEC-012 (Policy Engine) chi can tham chieu.
---
version: "1.0"
policy_model: [id, category, trigger, guard, action, priority, version]
policies:
  RETRY: { id: POL-RETRY-001, category: Recovery, trigger: Failed, guard: retry_count < max_retry, action: Retry, priority: High, version: 1.0.0 }
  TIMEOUT: { id: POL-TIMEOUT-001, category: Control, trigger: Running, guard: timeout exceeded, action: TimedOut, priority: High, version: 1.0.0 }
  APPROVAL: { id: POL-APPROVAL-001, category: Governance, trigger: Approval gate, guard: approval required, action: Waiting, priority: High, version: 1.0.0 }
  COMPENSATION: { id: POL-COMP-001, category: Recovery, trigger: Failure, guard: completed steps exist, action: Compensate, priority: Medium, version: 1.0.0 }
  PARALLEL: { id: POL-PARALLEL-001, category: Orchestration, trigger: Parallel tasks, guard: join policy, action: Scatter/Gather, priority: Medium, version: 1.0.0 }
  RESOURCE: { id: POL-RES-001, category: Resource, trigger: Allocate, guard: resource available, action: Allocate, priority: Critical, version: 1.0.0 }
rule: Execution Flow chỉ áp dụng policy, không định nghĩa policy.
