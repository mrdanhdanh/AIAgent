# SPEC-001 S003 — Runtime Responsibilities (35 RR)
# Mỗi responsibility đúng một Owner. Authority tách biệt.
---
id: SPEC-001-S003
name: Runtime Responsibilities
version: "1.0.0"
status: Approved
frozen: true
frozen_date: "2026-08-04"
owner: Runtime Team
principle: Responsibility != Capability != Component
invariants:
  - Một Responsibility chỉ có một Owner.
  - Một Responsibility có thể delegate.
  - Owner không đổi trong một Execution.
  - Không Responsibility nào phụ thuộc vòng.
delegation:
  Capability Resolution: Runtime
  Business Logic: Agent
  Knowledge Query: Skill
  Persistence: Infrastructure
