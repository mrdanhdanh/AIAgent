# SPEC-001 S006 — Component Model (C003) v2
---
version: "1.0"
model:
  fields:
    - id
    - name
    - version
    - status
    - layer
    - domain
    - responsibility
    - capability
    - contracts
    - dependencies
    - lifecycle
    - owner
    - metadata
rules:
  - Component phải versioned (P004).
  - Component có thể implement nhiều Contract.
  - Component có Dependency.
  - Component thường phục vụ nhiều Capability.
