# SPEC-001 S006 — Component Relationships
# Quan he giua cac component.
---
version: "1.0"
relationships:
  - from: Execution Coordinator
    to: Execution Manager
    type: orchestrates
  - from: Execution Manager
    to: Context Manager
    type: creates
  - from: Execution Manager
    to: State Manager
    type: uses
  - from: Execution Coordinator
    to: Capability Resolver
    type: resolves
  - from: Capability Resolver
    to: Registry Client
    type: queries
  - from: Execution Coordinator
    to: Policy Engine
    type: enforces
  - from: Execution Manager
    to: Event Publisher
    type: publishes
  - from: Execution Manager
    to: Artifact Publisher
    type: publishes
  - from: Execution Manager
    to: Metrics Collector
    type: reports
  - from: Execution Manager
    to: Resource Manager
    type: allocates
  - from: Workflow Manager
    to: Execution Manager
    type: feeds
