# SPEC-001 S006 — Runtime Components (12 Core Components) v4
# 3 nhom: Core / Resolution / Infrastructure. Moi component: version/status/capability/contracts/dependencies.
---
id: SPEC-001-S006
name: Runtime Components
version: "1.0.0"
status: Approved
frozen: true
frozen_date: "2026-08-04"
owner: Runtime Team
philosophy:
  - Component càng ít càng tốt.
  - Mỗi Component chỉ có một trách nhiệm.
  - Mở rộng bằng Capability, không mở rộng bằng thêm Component mới.
principles:
  - Một Responsibility.
  - Một Owner.
  - Một hoặc nhiều Contract.
  - Một Lifecycle.
  - Một Metadata.
  - Có thể thay thế.
  - Không chứa Business Logic.
  - Không phụ thuộc Component ngoài Contract.
component_model:
  fields: [id, name, version, status, layer, domain, responsibility, capability, contracts, dependencies, lifecycle, owner, metadata]
groups:
  Core: [Execution Manager, Execution Orchestrator, Context Manager, State Manager, Policy Engine]
  Resolution: [Workflow Loader, Capability Resolver, Registry Resolver]
  Infrastructure: [Event Dispatcher, Artifact Dispatcher, Metrics Collector, Execution Resource Manager]
lifecycles:
  runtime: [Defined, Initialized, Ready, Active, Stopping, Disposed]
  execution: [Idle, Assigned, Running, Completed]
components:
  CMP-001:
    name: Execution Manager
    version: 1.0.0
    status: Stable
    group: Core
    layer: Execution
    domain: Execution
    responsibility: Quản lý vòng đời Execution
    capability: execution-management
    contracts: [Execution Contract]
    dependencies: [Workflow Loader, Context Manager, State Manager, Execution Resource Manager, Event Dispatcher, Artifact Dispatcher, Metrics Collector, Execution Orchestrator]
    lifecycle: runtime
    owner: Runtime
    replaceable: false
    metric: Execution Completion Rate
    boundary: B001-ownership
    rule: RULE-004
    responsibilities: [RR-001, RR-002, RR-003]
    requirements: [FR-001, FR-015]
    principles: [P001, P005]
