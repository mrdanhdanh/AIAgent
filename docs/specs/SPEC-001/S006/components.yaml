# SPEC-001 S006 — Runtime Components (12 Core Components) v3
# Kernel Internal Architecture. Moi component: 1 responsibility/owner/contract/lifecycle/metadata.
---
id: SPEC-001-S006
name: Runtime Components
version: "1.0.0"
status: Draft
owner: Runtime Team
philosophy:
  - Component càng ít càng tốt.
  - Mỗi Component chỉ có một trách nhiệm.
  - Mở rộng bằng Capability, không mở rộng bằng thêm Component mới.
principles:
  - Một Responsibility.
  - Một Owner.
  - Một Contract.
  - Một Lifecycle.
  - Một Metadata.
  - Có thể thay thế.
  - Không chứa Business Logic.
  - Không phụ thuộc Component ngoài Contract.
component_model:
  id: CMP-###
  fields: [id, name, layer, domain, responsibility, contract, lifecycle, owner, metadata]
components:
  CMP-001:
    name: Execution Manager
    layer: Execution
    domain: Execution
    responsibility: Quản lý vòng đời Execution
    contract: Execution Contract
    state: Active, Terminated
    owner: Runtime
    replaceable: true
    metric: Execution Completion Rate
    responsibilities: [RR-001, RR-002, RR-003]
    requirements: [FR-001, FR-015]
    principles: [P001, P005]
  CMP-002:
    name: Workflow Loader
    layer: Workflow
    domain: Execution
    responsibility: Đọc và chuẩn bị Workflow
    contract: Workflow Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Workflow Load Rate
    responsibilities: [RR-005]
    requirements: [FR-002, FR-013]
    principles: [P001, P011]
  CMP-003:
    name: Execution Coordinator
    layer: Coordination
    domain: Coordination
    responsibility: Điều phối luồng thực thi
    contract: Coordinator Contract
    state: Active
    owner: Runtime
    replaceable: false
    metric: Orchestration Coverage
    responsibilities: [RR-004, RR-019, RR-021, RR-022, RR-023, RR-024]
    requirements: [FR-004, FR-010, FR-011, FR-012, FR-017, FR-018, FR-019]
    principles: [P001]
  CMP-004:
    name: Capability Resolver
    layer: Capability
    domain: Capability
    responsibility: Resolve Capability thành Agent
    contract: Capability Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Capability Resolution Rate
    responsibilities: [RR-006, RR-020]
    requirements: [FR-003]
    principles: [P007]
  CMP-005:
    name: Registry Resolver
    layer: Resolution
    domain: Capability
    responsibility: Truy cập Registry qua Contract và resolve
    contract: Registry Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Registry Lookup Rate
    responsibilities: [RR-006]
    requirements: [FR-003, FR-014]
    principles: [P007, P002]
  CMP-006:
    name: Context Manager
    layer: Execution
    domain: Execution
    responsibility: Quản lý Execution Context
    contract: Context Contract
    state: Created, Active, Closed
    owner: Runtime
    replaceable: true
    metric: Context Isolation
    responsibilities: [RR-011, RR-012, RR-013, RR-014]
    requirements: [FR-005, FR-016]
    principles: [P001, P009, P006]
  CMP-007:
    name: State Manager
    layer: State
    domain: State
    responsibility: Quản lý State Machine
    contract: State Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Invalid Transitions
    responsibilities: [RR-015, RR-016, RR-017, RR-018]
    requirements: [FR-006]
    principles: [P005, P009]
  CMP-008:
    name: Event Dispatcher
    layer: Event
    domain: Observability
    responsibility: Publish Event, hỗ trợ nhiều cơ chế
    contract: Event Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Event Coverage
    responsibilities: [RR-025, RR-028]
    requirements: [FR-007]
    principles: [P005, P014]
  CMP-009:
    name: Artifact Dispatcher
    layer: Publication
    domain: Publication
    responsibility: Bàn giao Artifact (không lưu trữ)
    contract: Artifact Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Artifact Dispatch Rate
    responsibilities: [RR-029, RR-030, RR-031]
    requirements: [FR-008, FR-020]
    principles: [P010, P005]
  CMP-010:
    name: Metrics Collector
    layer: Event
    domain: Observability
    responsibility: Thu Metrics
    contract: Metrics Contract
    state: Active
    owner: Runtime
    replaceable: true
    metric: Metrics Emission
    responsibilities: [RR-026, RR-027]
    requirements: [FR-009]
    principles: [P014]
  CMP-011:
    name: Policy Engine
    layer: Coordination
    domain: Coordination
    responsibility: Thực thi Policy/Governance
    contract: Policy Contract
    state: Active
    owner: Runtime
    replaceable: false
    metric: Policy Compliance
    responsibilities: [RR-032, RR-033, RR-034, RR-035]
    requirements: [FR-014, FR-019]
    principles: [P016, P020]
  CMP-012:
    name: Execution Resource Manager
    layer: Execution
    domain: Execution
    responsibility: Quản lý tài nguyên trong một Execution
    contract: Resource Contract
    state: Allocated, Released
    owner: Runtime
    replaceable: true
    metric: Resource Leak
    responsibilities: [RR-001]
    requirements: [FR-015, FR-016]
    principles: [P015]
not_in_runtime:
  - Agent
  - Workflow Definition
  - Registry
  - Plugin
  - Knowledge
  - Doctor
  - Dashboard
  - Simulation
  - Evolution
  - SDK
  note: Runtime chi su dung, khong so huu.
