# SPEC-001 S006 — Runtime Components (12 Core Components)
# Moi component thuoc 1 Layer + 1 Domain (S005). Khong them nua.
---
id: SPEC-001-S006
name: Runtime Components
version: "1.0.0"
status: Draft
owner: Runtime Team
principle: Component thuoc 1 Domain va 1 Layer
components:
  CMP-001:
    name: Execution Manager
    layer: Execution
    domain: Execution
    description: Khởi tạo, quản lý và kết thúc Execution.
    responsibilities: [RR-001, RR-002, RR-003]
    requirements: [FR-001, FR-015]
    principles: [P001, P005]
  CMP-002:
    name: Workflow Manager
    layer: Workflow
    domain: Execution
    description: Nạp và validate Workflow Definition, tạo Execution Plan.
    responsibilities: [RR-005]
    requirements: [FR-002, FR-013]
    principles: [P001, P011]
  CMP-003:
    name: Context Manager
    layer: Execution
    domain: Execution
    description: Tạo/cấp/thu hồi Context, cô lập giữa các Execution.
    responsibilities: [RR-011, RR-012, RR-013, RR-014]
    requirements: [FR-005, FR-016]
    principles: [P001, P009, P006]
  CMP-004:
    name: State Manager
    layer: State
    domain: State
    description: Khởi tạo, theo dõi, chuyển State, kết thúc Terminal State.
    responsibilities: [RR-015, RR-016, RR-017, RR-018]
    requirements: [FR-006]
    principles: [P005, P009]
  CMP-005:
    name: Capability Resolver
    layer: Capability
    domain: Capability
    description: Resolve Capability và mapping Capability → Agent.
    responsibilities: [RR-006, RR-020]
    requirements: [FR-003]
    principles: [P007]
  CMP-006:
    name: Registry Client
    layer: Resolution
    domain: Capability
    description: Registry Lookup và Contract Validation.
    responsibilities: [RR-006]
    requirements: [FR-003, FR-014]
    principles: [P007, P002]
  CMP-007:
    name: Event Publisher
    layer: Event
    domain: Observability
    description: Publish Event, ghi Audit Trail.
    responsibilities: [RR-025, RR-028]
    requirements: [FR-007]
    principles: [P005, P014]
  CMP-008:
    name: Artifact Publisher
    layer: Publication
    domain: Publication
    description: Sinh và publish Artifact, không sửa Artifact đã sinh.
    responsibilities: [RR-029, RR-030, RR-031]
    requirements: [FR-008, FR-020]
    principles: [P010, P005]
  CMP-009:
    name: Metrics Collector
    layer: Event
    domain: Observability
    description: Thu Metrics, sinh Trace.
    responsibilities: [RR-026, RR-027]
    requirements: [FR-009]
    principles: [P014]
  CMP-010:
    name: Policy Engine
    layer: Coordination
    domain: Coordination
    description: Thực thi Constitution, kiểm tra Contract, áp dụng Policy, từ chối vi phạm.
    responsibilities: [RR-032, RR-033, RR-034, RR-035]
    requirements: [FR-014, FR-019]
    principles: [P016, P020]
  CMP-011:
    name: Resource Manager
    layer: Execution
    domain: Execution
    description: Allocate/Release Execution Resources, cô lập tài nguyên.
    responsibilities: [RR-001]
    requirements: [FR-015, FR-016]
    principles: [P015]
  CMP-012:
    name: Execution Coordinator
    layer: Coordination
    domain: Coordination
    description: Điều phối luồng, đồng bộ, retry, cancellation, approval gate.
    responsibilities: [RR-004, RR-019, RR-021, RR-022, RR-023, RR-024]
    requirements: [FR-004, FR-010, FR-011, FR-012, FR-017, FR-018, FR-019]
    principles: [P001]
not_in_runtime:
