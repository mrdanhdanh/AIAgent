# SPEC-001 S011 - Lineage
# File doc chung cho Dashboard, Doctor, Evolution. Tham chieu S010 EF023.
---
version: "1.0.0"
model:
  fields: [execution_id, root_id, parent_id, lineage_type, created_at]
lineage_types: [root, parent, child, replay, simulation, fork]
rules:
  - Lineage immutable (append-only).
  - Moi Execution co lineage_ref.
  - Clone khong phai Execution (la Operation, khong thuoc Lineage).
