# SPEC-001 S011 - Trace Model
# Khong phu thuoc implementation.
---
version: "1.0"
model:
  fields: [trace_id, span_id, parent_span_id, correlation_id, execution_id, operation, started_at, ended_at, duration, status]
scope:
  - Execution
  - Parent
  - Child
  - Correlation
  - Causation
  - Lineage
rules:
  - Trace chi append.
  - Trace luon truoc Metrics (S010 EF010).
  - Span cha-con qua parent_span_id.
  - Correlation khac Causation: Correlation lien ket, Causation chi nguyen nhan.
