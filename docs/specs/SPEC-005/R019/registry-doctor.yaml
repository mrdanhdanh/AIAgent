# SPEC-005 R019 - Registry Doctor
---
id: SPEC-005-R019
name: Registry Doctor
version: "1.0.0"
status: Draft
frozen: false
owner: Registry Team
philosophy:
  - Registry Doctor la co che kiem tra suc khoe Registry.
  - Doctor chi doc machine-readable (R011).
  - Khong dinh nghia lai quy tac (R016 da tong hop).
  - Self-repair chi thay doi an toan, co gioi han.
principles:
  - Evidence Based
  - Machine-readable First
  - Non-invasive
  - Deterministic
  - Repairable (self-repair an toan)
  - Auditable
scope:
  checks_domains:
    - Constitution (SPEC-000)
    - Contracts (R007)
    - Policy Binding (R012)
    - Governance (R013)
    - Registry-of-Registries (R014)
    - Resources (R015)
    - Compliance (R016)
    - Extensions (R017)
    - Observability (R011)
  not_reads:
    - Implementation
    - Business Data
    - Agent Internal State
    - Plugin Internal State
check_sources:
  - "R011 Observability: 5 checks"
  - "R013 Governance: 6 checks"
  - "R014 Registry-of-Registries: 7 checks"
  - "R015 Resources: 5 checks"
  - "R016 Compliance: 12 rules"
  - "R017 Extensions: 6 checks"
  - "R018 Evolution: 6 checks"
health_score: [Healthy, Degraded, Unhealthy]
pipeline:
  - Collect (machine-readable)
  - Validate (checks per domain)
  - Score (health - R016)
  - Report (registry-doctor-report)
  - Repair (neu an toan, self-repair)
self_repair:
  - Chi Low impact.
  - Qua Approval (R013) hoac auto cho quen thuoc.
  - Co rollback.
  - Ghi Audit (R011).
  - Khong sua implementation.
  - Khong Repair vi pham CRITICAL - bao cao len nguoi.
report:
  fields: [id, timestamp, registry_version, checks, score, status, repair, evidence]
events:
  - REGISTRY_DOCTOR_RUN
  - REGISTRY_DOCTOR_PASSED
  - REGISTRY_DOCTOR_FAILED
  - REGISTRY_DOCTOR_REPORTED
  - REGISTRY_DOCTOR_REPAIRED
metrics:
  health_score: 0
  passed_checks: 0
  failed_checks: 0
  warning_checks: 0
  total_checks: 0
  repair_count: 0
traceability:
  - Registry Doctor Report
  - Checks
  - Evidence (R011)
  - SPEC source (R0xx)
