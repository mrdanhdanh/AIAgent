# SPEC-013 X008 - Evolution Validation Rules
---
version: "1.0.0"
validation_rules:
  VAL-X001: { field: EvolutionId, requirement: Required, type: UUID }
  VAL-X002: { field: VersionFrom, requirement: Required, type: SemVer }
  VAL-X003: { field: VersionTo, requirement: Required, type: SemVer }
  VAL-X004: { field: Diff, requirement: Required, type: "SemanticDiff[]" }
  VAL-X005: { field: Compatibility, requirement: Required, type: Enum }
  VAL-X006: { field: MigrationPlan, requirement: Optional, type: Object }
  VAL-X007: { field: Timestamp, requirement: Required, type: Timestamp }
validate_on:
  - Diff
  - Migrate
