# SPEC-002 W005 — Workflow Architecture (Blueprint)
# Layer View + Domain View. Logical, khong implementation.
# Workflow Engine khong co Execution/State/Event layer rieng - thuoc Runtime (SPEC-001).
---
id: SPEC-002-W005
name: Workflow Architecture
version: "1.0.0"
status: Draft
frozen: false
owner: Workflow Team
vision: Lop khai bao va dieu phoi luong nghiep vu tren Runtime Kernel. Moi tang mot trach nhiem, giao tiep qua Contract.
decisions:
  - Workflow Engine la Declarator, khong phai Executor.
  - Workflow Engine uu tien Metadata hon Configuration.
  - Workflow Engine chi phu thuoc Abstraction.
  - Workflow Engine khong biet Implementation.
  - Workflow Engine khong chua Domain Logic.
  - Workflow Engine duoc thiet ke de Evolution ma khong pha vo Core.
  - Execution/State/Event thuoc Runtime (SPEC-001) - khong lap lai.
layers:
  Command:
    level: 1
    domain: Execution
    input: User Request
    output: Workflow Command
    responsibility: [Entry Point, Nhan Workflow Command]
    not_responsibility: [Nghiep vu]
    invariant: Khong chua nghiep vu
    principle: P001
  Declaration:
    level: 2
    domain: Definition
    input: Workflow Declaration (YAML)
    output: Workflow Definition
    responsibility: [Nhan khai bao, Parse YAML, Schema Check]
    not_responsibility: [Code, Script]
    invariant: Khong nhan code (WB001)
    principle: P003
  Definition:
    level: 3
    domain: Definition
    input: Workflow Definition
    output: Versioned Workflow
    responsibility: [Workflow Model, Version, Registry Entry (S014)]
    not_responsibility: [Thuc thi]
    invariant: Khong thuc thi (WB004)
    principle: P011
  Validation:
    level: 4
    domain: Validation
    input: Workflow Definition
    output: Normalized Workflow
    responsibility: [Validate cau truc, Validate tham chieu, Normalize (EF006)]
    not_responsibility: [Chay step]
    invariant: Validate truoc khi chay (WB003)
    principle: P011
  Resolution:
    level: 5
    domain: Capability
    input: Step Capability Request
    output: Resolved Capability
    responsibility: [Registry Lookup (S014), Capability Mapping]
    not_responsibility: [Biet Agent]
    invariant: Khong biet Agent (WB006)
    principle: P007
  Orchestration:
    level: 6
    domain: Coordination
    input: Normalized Workflow
    output: Runtime Execution Request
    responsibility: [Sequential, Parallel (EF021), Barrier, Gate, Retry, Timeout, Compensation (EF022)]
    not_responsibility: [Tu chay step, Business Logic]
    invariant: Khong tu chay - giao Runtime (WB004)
    principle: P001
  Publication:
    level: 7
    domain: Observability
    input: Workflow State Change
    output: Workflow Event
    responsibility: [Publish Event, Publish Metrics, Publish Trace, Audit (S011)]
    not_responsibility: [Business Data]
    invariant: Khong chua Business Data
    principle: P014
domains:
  Definition:
    owner: Workflow
    contains_business_logic: false
  Validation:
    owner: Workflow
    contains_business_logic: false
  Execution:
    owner: Runtime (SPEC-001)
    contains_business_logic: false
  Coordination:
    owner: Runtime (SPEC-001)
    contains_business_logic: false
  Capability:
    owner: Runtime (S014)
    contains_business_logic: false
  Observability:
    owner: Runtime (S011)
    contains_business_logic: false
dependency_rules:
  - "Layer N -> Layer N+1: duoc phep"
  - "Layer N -> Layer N+2: khong duoc phep"
  - "Khong Circular Dependency"
  - "Khong Skip Layer"
  - "Orchestration -> Runtime: duoc phep (delegate)"
communication_rules:
  - Contract
  - Context
  - Event
  # note: Ngoai ra deu bi cam.
invariants:
  - Workflow Engine luon Metadata Driven.
  - Workflow Engine khong biet Agent cu the.
  - Workflow Engine khong biet Plugin cu the.
  - Workflow Engine khong phu thuoc Framework.
  - Workflow Engine luon Declarative.
  - Workflow Engine luon Event Driven.
  - Workflow Engine luon Contract First.
views:
  layer_view: [Command, Declaration, Definition, Validation, Resolution, Orchestration, Publication]
  dependency_view: [Definition, Validation, Resolution, Orchestration, Runtime]
  data_flow_view: [Workflow Definition, Context, Artifact]
  event_flow_view: [Orchestration, Runtime, Event, Metrics, Dashboard]
quality:
  Modularity: Cao
  Coupling: Thap
  Cohesion: Cao
  Extensibility: Rat cao
  Testability: Cao
  Evolvability: Rat cao
  Determinism: "100%"
constraints:
  - Circular Dependency
  - Hidden Dependency
  - Shared Mutable State
  - Code trong Workflow
  - Direct Agent Coupling
  - Direct Plugin Coupling
  - Business Logic trong Workflow Engine
  # note: Tat ca deu CAM.
stability:
  stable: [Layers, Domains]
  evolvable: [Workflow Schema, Contracts, Capabilities]
  replaceable: [Agents, Plugins, Workflows]
metrics:
  layer_count: 7
  domain_count: 6
  max_layer_dependency: 1
  circular_dependency: 0
  contract_violation: 0
  hidden_dependency: 0
validation:
  - Layering
  - Dependency
  - Coupling
  - Circular Dependency
  - Contract Compliance
  - Boundary Compliance (W004)
  - Principle Compliance
mapping:
  Layering: P008
  Contract: P002
  Event: P005
  Capability: P007
  Metadata: P003
  Plugin: P012
  Constitution: P020
