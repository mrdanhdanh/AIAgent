# SPEC-002 W011 - Workflow Events (S011 reuse)
# Definition-level: WORKFLOW_*. Run-level: EXECUTION_* (S011).
---
version: "1.0"
definition_events:
  - WORKFLOW_VALIDATING
  - WORKFLOW_PUBLISHED
  - WORKFLOW_REJECTED
  - WORKFLOW_DEPRECATED
  - WORKFLOW_REACTIVATED
  - WORKFLOW_RETIRED
run_events:
  note: Workflow Run dung EXECUTION_* cua S011 (Runtime).
rules:
  - Event immutable (P005).
  - Event chi append.
  - Moi transition sinh Event (W009).
  - Event co correlation_id.
