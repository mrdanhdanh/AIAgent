# SPEC-003 C017 - Capability Extensions
# Mo rong Capability System qua Contract (C007), dang ky Registry (S014).
# Khong sua Capability System core.
---
id: SPEC-003-C017
name: Capability Extensions
version: "1.0.0"
status: Draft
frozen: false
owner: Capability Team
philosophy:
  - Extension mo rong Capability System qua Contract (C007).
  - Extension khong sua Capability System core.
  - Moi Extension dang ky trong Registry (S014).
  - Extension chi truy cap qua Capability + Contract.
principles:
  - Contract First (C007)
  - Registry First (S014)
  - Isolated (S012 POL-ISOL-001)
  - Least Privilege (S012 POL-SEC-001)
  - Versioned (SemVer)
  - Verifiable (C016)
categories:
  - Capability Type Extension
  - Binding Extension (C012)
  - Mapping Extension
  - Resolver Extension
  - Compatibility Extension
extension_model:
  fields: [id, name, version, category, status, owner, capabilities, contracts, dependencies, metadata]
lifecycle: [Draft, Published, Installed, Active, Disabled, Retired]
installation:
  - Register (S014 plugin-registry)
  - Validate (Contract C007 + Compatibility C013)
  - Install
  - Activate
activation_rules:
  - Contract hop le (C007).
  - Compatibility pass (C013).
  - Governance allow (C013).
  - Isolation dam bao (S012 POL-ISOL-001).
isolation:
  - Context isolated (S010 EF008).
  - Resource bounded (C015 quota).
  - Khong truy cap Agent Internal State (S011 OB003A).
  - Khong truy cap Extension khac (goi qua Contract).
security:
  - Permission qua POL-SEC-001 (S012).
  - Deny mac dinh (C013).
resources:
  - Extension owner resource (C015).
  - Quota rieng cho moi Extension.
compatibility:
  - Contract (C013)
  - Capability (C013)
  - Agent (C013)
  - Registry compatibility check (C014)
events:
  - CAPABILITY_EXTENSION_REGISTERED
  - CAPABILITY_EXTENSION_INSTALLED
  - CAPABILITY_EXTENSION_ACTIVATED
  - CAPABILITY_EXTENSION_DISABLED
  - CAPABILITY_EXTENSION_FAILED
  - CAPABILITY_EXTENSION_UNINSTALLED
metrics:
  active_extensions: 0
  installed_extensions: 0
  failed_extensions: 0
  extension_calls: 0
  extension_errors: 0
  avg_extension_latency: 0
