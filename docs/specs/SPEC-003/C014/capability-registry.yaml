# SPEC-003 C014 - Capability Registry
# Capability dang ky trong Registry cua Runtime (S014 capability-registry).
# Khong mo ta database/storage/API/implementation.
---
id: SPEC-003-C014
name: Capability Registry
version: "1.0.0"
status: Draft
frozen: false
owner: Capability Team
philosophy:
  - Capability Registry la SSOT cho Capability Metadata.
  - Capability khong hardcode - moi nang luc dang ky trong S014.
  - Moi Resolution deu di qua Registry.
  - Registry khong chua Business Logic.
principles:
  - Metadata First
  - Contract First (C007)
  - Versioned
  - Discoverable
  - Immutable (Published)
  - Traceable
categories:
  note: Capability Registry la 1 category cua S014 (capability-registry).
  - Capability Definition
  - Capability Version
  - Capability Binding (C012)
domains:
  - Capability Domain
  - Definition Domain
  - Binding Domain
entry_model:
  fields: [id, type, category, version, status, owner, references, compatibility, lifecycle, metadata]
ownership:
  Capability Entry: Capability Team
  Binding Entry: Capability Team
  Registry (S014): Runtime
lifecycle: [Draft, Published, Deprecated, Retired]
governance:
  - Published
  - Immutable
  - Governance (S013)
  - Deprecated
  - Retired
constraints:
  - Khong Duplicate Capability ID.
  - Khong Duplicate Version.
  - Khong Broken Reference (S014).
  - Khong Circular Reference (S014).
  - Khong Orphan Entry (S014).
  - Khong Multiple Active Version.
  - Khong Hardcode Mapping (CB007).
resolution:
  - Request
  - Normalize
  - Lookup (S014)
  - Candidate Selection
  - Compatibility Check
  - Policy Binding Check (C012)
  - Governance Check (S013)
  - Resolved
resolution_rules:
  - Resolve theo ID (S014).
  - Nhieu Version -> ap dung Resolution Priority.
  - Khong Resolve Entry Deprecated neu co ban Active.
  - Khong Resolve Entry Invalid.
resolution_priority:
  - Exact
  - Compatible
  - Latest Stable
  - Latest
  - Failure
resolution_failures:
  NotFound: khong ton tai
  Invalid: schema loi
  Deprecated: het ho tro
  Incompatible: version
  Forbidden: governance
  Ambiguous: nhieu candidate
version_resolution:
  - Exact Version
  - Compatible Version
  - Latest Compatible
  - Failure
relationships:
  Capability: [Definition, Mapping, Binding]
  Definition: [Version]
  Mapping: [Agent (SPEC-004), Plugin (S017)]
  Binding: [Policy (S012)]
dependency:
  Capability: Definition
  Definition: Registry (S014)
  Mapping: Agent (SPEC-004)
  Binding: Policy (S012)
  note: Khong circular (DAG).
traceability:
  - Registry (S014)
  - Capability
  - Execution (S008)
  - Artifact
events:
  - CAPABILITY_REGISTERED
  - CAPABILITY_UPDATED
  - CAPABILITY_DEPRECATED
  - CAPABILITY_RETIRED
  - CAPABILITY_RESOLUTION_FAILED
  - CAPABILITY_COMPATIBILITY_FAILED
metrics:
  capability_entries: 0
  active_capabilities: 0
  deprecated_capabilities: 0
  resolution_success_rate: 0
  resolution_time: 0
  failed_resolution: 0
