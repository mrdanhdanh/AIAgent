  - Doctor chi doc machine-readable (S011).
  - Khong dinh nghia lai quy tac da co.
  - Certification cho tung Capability System implementation.
principles:
  - Evidence Based (S016)
  - Machine-readable First (S016)
  - Deterministic (S016)
  - Verifiable (S016)
  - Non-invasive (S016)
  - Versioned (S016)
scope:
  verifies:
    - Constitution (SPEC-000)
    - Boundary (C004)
    - Contract (C007)
    - Policy Binding (C012)
    - Governance (C013)
    - Registry (C014)
    - Resources (C015)
    - Observability (C011)
validation_rules:
  - Invalid Capability (C009/C002)
  - Invalid Binding (C012)
  - Boundary Violation (C004)
  - Contract Failure (C007)
  - Registry Violation (C014)
  - Resource Leak (C015)
  - Quota Violation (C015)
  - Missing Capability Event (C011)
