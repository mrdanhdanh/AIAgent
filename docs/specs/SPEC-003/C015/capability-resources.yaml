# Khong mo ta database/storage/API/implementation.
---
id: SPEC-003-C015
name: Capability Resources
version: "1.0.0"
status: Draft
frozen: false
owner: Capability Team
philosophy:
  - Capability dung Resource cua Runtime (S015) - khong quan ly rieng.
  - Quota khai bao qua binding (C012 CPB-004).
  - Khong Resource nao bi Leak.
  - Capability khong hardcode tai nguyen.
principles:
  - "Allocated: moi tai nguyen cap phat tuong minh (S015)."
  - "Released: giai phong tren Terminal State (S015)."
  - "Bounded: quota qua binding (C012)."
  - "Observable: quan sat qua S011 (S015)."
  - "Traceable: moi allocation truy vet (S015)."
categories:
# note: Dung 10 categories cua S015 RS003.
  - Capability
  - Execution
  - Context
  - Memory
  - Storage
  - Compute
  - Network
  - Quota
  - Token
  - Time
resource_model:
  fields: [id, type, category, owner, status, capacity, allocated, quota, references, metadata]
lifecycle: [Draft, Available, Allocated, In Use, Released, Depleted]
allocation:
  - Request (capability resolution)
  - Binding Check (C012 CPB-004 -> POL-RES-001)
  - Allocate (S015 qua Runtime)
  - Bind to Capability
  - Track (S011)
access:
  - Request
  - Binding Check (C012 CPB-010 -> POL-RESACC-001)
  - Grant / Deny
ownership:
  Capability Execution: Capability (qua Runtime S015)
  Quota: Capability Team (khai bao)
  Resource: Runtime (S015)
constraints:
  - Khong Double Allocation (S015).
  - Khong Resource Leak (S015).
  - Ton trong quota binding (C012).
  - Release tren Terminal State (S009).
registry_reference:
  - Resource dang ky trong Registry (S014).
  - Binding tham chieu policy (S012).
traceability:
  - Capability Resolution
  - Allocation (S015)
  - Execution (S008)
  - Artifact
events:
  - CAPABILITY_RESOURCE_ALLOCATED
  - CAPABILITY_RESOURCE_RELEASED
  - CAPABILITY_RESOURCE_EXHAUSTED
  - CAPABILITY_RESOURCE_LEAKED
  - CAPABILITY_RESOURCE_DENIED
  - CAPABILITY_RESOURCE_QUEUED
metrics:
  capability_resource_allocations: 0
  capability_resource_releases: 0
  active_capability_resources: 0
  leak_count: 0
  exhaustion_count: 0
  quota_utilization: 0
  denied_count: 0
