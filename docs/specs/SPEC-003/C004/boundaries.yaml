# SPEC-003 C004 — Capability Boundaries (Firewall cua Capability System)
# 9 boundary + hierarchy + severity + violations + metrics.
---
id: SPEC-003-C004
name: Capability Boundaries
version: "1.0.0"
status: Draft
frozen: false
owner: Capability Team
hierarchy:
  Capability Boundary:
    - CB001-declaration
    - CB002-registry
    - CB003-validation
    - CB004-resolution
    - CB005-interface
    - CB006-dependency
    - CB007-mapping
    - CB008-policy
    - CB009-governance
decision:
  - Neu mot chuc nang khong xac dinh duoc Boundary, chuc nang do khong duoc phep dua vao Capability System.
invariants:
  - Capability System khong vuot qua Boundary.
  - Capability System khong tu resolve - giao cho Runtime (EF007).
  - Capability System chi giao tiep qua Contract (S007).
  - Capability System chi phu thuoc vao Abstraction.
  - Capability System khong biet implementation cua Agent.
  - Capability System khong biet implementation cua Plugin.
validation:
  - Co code trong Capability khong?
  - Capability System co tu resolve khong?
  - Capability System co goi Agent cu the khong?
  - Capability System co phu thuoc Plugin cu the khong?
  - Capability System co hardcode mapping khong?
  - Capability System co dinh nghia policy rieng khong?
  - Capability System co giao tiep ngoai Contract khong?
boundaries:
