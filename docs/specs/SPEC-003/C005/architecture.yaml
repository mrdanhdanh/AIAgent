# SPEC-003 C005 — Capability Architecture (Blueprint)
# Layer View + Domain View. Logical, khong implementation.
# Capability System khong co Execution/State/Event layer rieng - thuoc Runtime (SPEC-001).
---
id: SPEC-003-C005
name: Capability Architecture
version: "1.0.0"
status: Draft
frozen: false
owner: Capability Team
vision: Lop khai bao va phan giai nang luc tren Runtime Kernel. Moi tang mot trach nhiem, giao tiep qua Contract.
decisions:
  - Capability System la Declarator + Resolver, khong phai Executor.
  - Capability System uu tien Metadata hon Configuration.
  - Capability System chi phu thuoc Abstraction.
  - Capability System khong biet Implementation.
  - Capability System khong chua Domain Logic.
  - Capability System duoc thiet ke de Evolution ma khong pha vo Core.
  - Resolution/Execution thuoc Runtime (SPEC-001 EF007) - khong lap lai.
layers:
  Command:
    level: 1
    domain: Execution
    input: Capability Request
    output: Capability Command
    responsibility: [Entry Point, Nhan Capability Request]
    not_responsibility: [Nghiep vu]
    invariant: Khong chua nghiep vu
    principle: P001
  Declaration:
    level: 2
    domain: Definition
    input: Capability Declaration (metadata)
    output: Capability Definition
    responsibility: [Nhan khai bao, Parse metadata, Schema Check]
    not_responsibility: [Code, Script]
    invariant: Khong nhan code (CB001)
    principle: P003
  Definition:
    level: 3
    domain: Definition
    input: Capability Definition
    output: Versioned Capability
    responsibility: [Capability Model, Version, Capability Group]
    not_responsibility: [Dang ky]
    invariant: Khong dang ky truc tiep (CB002)
    principle: P011
  Validation:
    level: 4
    domain: Validation
    input: Capability Definition
    output: Validated Capability
    responsibility: [Validate cau truc, Validate tham chieu, Compatibility Check (S013 GV010)]
    not_responsibility: [Dang ky]
    invariant: Validate truoc khi dang ky (CB003)
    principle: P011
  Registration:
    level: 5
    domain: Mapping
    input: Validated Capability
    output: Registry Entry (S014)
    responsibility: [Dang ky S014, Mapping Agent/Plugin, Capability Group]
    not_responsibility: [Hardcode mapping]
    invariant: Khong hardcode mapping (CB007)
    principle: P003
  Resolution:
    level: 6
    domain: Capability
    input: Capability Request
    output: Resolved Capability
    responsibility: [Registry Lookup (S014), Delegate Runtime (EF007), Fallback]
    not_responsibility: [Tu resolve, Biet Agent]
    invariant: Khong tu resolve - giao Runtime (CB004)
    principle: P007
  Publication:
    level: 7
    domain: Observability
    input: Capability State Change
    output: Capability Event
    responsibility: [Publish Event, Publish Metrics, Trace, Audit (S011)]
    not_responsibility: [Business Data]
    invariant: Khong chua Business Data
    principle: P014
domains:
  Definition:
    owner: Capability
    contains_business_logic: false
  Validation:
    owner: Capability
    contains_business_logic: false
  Mapping:
    owner: Capability
    contains_business_logic: false
  Capability:
    owner: Runtime (S014)
    contains_business_logic: false
  Execution:
    owner: Runtime (SPEC-001)
    contains_business_logic: false
  Observability:
    owner: Runtime (S011)
    contains_business_logic: false
dependency_rules:
  - "Layer N -> Layer N+1: duoc phep"
  - "Layer N -> Layer N+2: khong duoc phep"
  - "Khong Circular Dependency"
  - "Khong Skip Layer"
  - "Resolution -> Runtime: duoc phep (delegate EF007)"
communication_rules:
  - Contract
  - Context
  - Event
# note: Ngoai ra deu bi cam.
invariants:
  - Capability System luon Metadata Driven.
  - Capability System khong biet Agent cu the.
  - Capability System khong biet Plugin cu the.
  - Capability System khong phu thuoc Framework.
  - Capability System luon Declarative.
  - Capability System luon Event Driven.
  - Capability System luon Contract First.
views:
  layer_view: [Command, Declaration, Definition, Validation, Registration, Resolution, Publication]
  dependency_view: [Definition, Validation, Registration, Resolution, Runtime]
  data_flow_view: [Capability Definition, Registry Entry, Agent Mapping]
  event_flow_view: [Resolution, Runtime, Event, Metrics, Dashboard]
quality:
  Modularity: Cao
  Coupling: Thap
  Cohesion: Cao
  Extensibility: Rat cao
  Testability: Cao
  Evolvability: Rat cao
  Determinism: "100%"
constraints:
  - Circular Dependency
  - Hidden Dependency
  - Shared Mutable State
  - Code trong Capability
  - Direct Agent Coupling
  - Direct Plugin Coupling
  - Business Logic trong Capability System
# note: Tat ca deu CAM.
stability:
  stable: [Layers, Domains]
  evolvable: [Capability Schema, Contracts, Groups]
  replaceable: [Agents, Plugins, Capabilities]
metrics:
  layer_count: 7
  domain_count: 6
  max_layer_dependency: 1
  circular_dependency: 0
  contract_violation: 0
  hidden_dependency: 0
validation:
  - Layering
  - Dependency
  - Coupling
  - Circular Dependency
  - Contract Compliance
  - Boundary Compliance (C004)
  - Principle Compliance
mapping:
  Layering: P008
  Contract: P002
  Event: P005
  Capability: P007
  Metadata: P003
  Plugin: P012
  Constitution: P020
