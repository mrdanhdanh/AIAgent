# SPEC-009 X008 - Contract Data Model
---
version: "1.0"
entities:
  ENT-X001: { name: Contract, kind: AggregateRoot, owner: Contract Registry, immutable: true }
  ENT-X002: { name: ContractDefinition, kind: Entity, owner: Contract Registry, immutable: true }
  ENT-X003: { name: ContractVersion, kind: Entity, owner: Contract Registry, immutable: true }
  ENT-X004: { name: ContractSchema, kind: Entity, owner: Contract Registry, immutable: true }
  ENT-X005: { name: ContractBinding, kind: Value, owner: Contract Registry, immutable: false }
  ENT-X006: { name: ContractState, kind: Transient, owner: Contract Registry, immutable: false }
  ENT-X007: { name: ContractVerification, kind: Entity, owner: Contract Registry, immutable: true }
  ENT-X008: { name: ContractEvent, kind: Ref (S011), owner: Runtime, immutable: true }
  ENT-X009: { name: ContractMetric, kind: Ref (S011), owner: Runtime, immutable: true }
  ENT-X010: { name: ContractSnapshot, kind: Entity, owner: Contract Registry, immutable: false }
  ENT-X011: { name: ExecutionRef, kind: Ref (SPEC-001), owner: Execution, immutable: true }
  ENT-X012: { name: ProviderRef, kind: Ref (SPEC-004/002), owner: Agent/Task, immutable: true }
  ENT-X013: { name: CallerRef, kind: Ref (SPEC-004), owner: Agent, immutable: true }
  ENT-X014: { name: PolicyRef, kind: Ref (S012), owner: Runtime, immutable: true }
  ENT-X015: { name: ContractExtension, kind: Value, owner: Contract Registry, immutable: true }
relations:
  REL-X001: { from: Contract, to: ContractDefinition, cardinality: 1..1 }
  REL-X002: { from: Contract, to: ContractVersion, cardinality: 1..* }
  REL-X003: { from: Contract, to: ContractSchema, cardinality: 1..1 }
  REL-X004: { from: Contract, to: ContractBinding, cardinality: 0..* }
  REL-X005: { from: Contract, to: ContractState, cardinality: 1..1 }
  REL-X006: { from: Contract, to: ContractVerification, cardinality: 0..* }
  REL-X007: { from: Contract, to: ExecutionRef, cardinality: 1..1 }
  REL-X008: { from: Contract, to: ContractEvent, cardinality: 0..* }
  REL-X009: { from: Contract, to: ContractSnapshot, cardinality: 0..* }
invariants:
  INV-X001: { name: Unique ContractId, description: Moi Contract co id duy nhat }
  INV-X002: { name: Interface Only, description: Contract khong chua implementation }
  INV-X003: { name: Versioned, description: Moi Contract co version (P004) }
  INV-X004: { name: Compatible, description: Version moi backward compatible }
  INV-X005: { name: Schema Valid, description: Schema hop le }
  INV-X006: { name: No Direct Call, description: Goi qua Contract }
  INV-X007: { name: No Business Data, description: Contract khong chua business data }
validation:
  VAL-X001: { field: ContractId, requirement: Required, type: UUID }
  VAL-X002: { field: Version, requirement: Required, type: SemVer }
  VAL-X003: { field: ProviderId, requirement: Required, type: UUID }
  VAL-X004: { field: Schema, requirement: Required, type: JSON Schema }
  VAL-X005: { field: InputType, requirement: Required, type: Type }
  VAL-X006: { field: OutputType, requirement: Required, type: Type }
  VAL-X007: { field: Compatibility, requirement: Required, type: Enum }
storage:
  mode: Versioned store
  persistence: "true (P004 - versioned)"
  snapshot: ContractSnapshot (optional, debug)
  source: S007 Contract Model
