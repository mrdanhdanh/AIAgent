version: "1.0"
stages:
  XF-001: { name: Declare, description: Nhan Contract tu Provider, actor: Contract System, event: CONTRACT_DECLARED }
  XF-002: { name: Validate, description: Validate schema + invariants, actor: Contract System, event: CONTRACT_VALIDATING }
  XF-003: { name: CompatCheck, description: Kiem tra backward compatible, actor: CompatChecker, event: CONTRACT_COMPAT_CHECKED }
