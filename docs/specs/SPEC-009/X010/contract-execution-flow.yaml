  XF-005: { name: Resolve, description: Tra cho caller, actor: Contract System, event: CONTRACT_RESOLVED }
  XF-006: { name: Verify, description: Verify truoc khi dung, actor: Verifier, event: CONTRACT_VERIFIED }
  XF-007: { name: Bind, description: Gan caller, actor: Contract System, event: CONTRACT_BOUND }
  XF-008: { name: Retire, description: Retire khi het han, actor: Contract System, event: CONTRACT_RETIRED }
