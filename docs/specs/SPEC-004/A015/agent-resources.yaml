---
id: SPEC-004-A015
name: Agent Resources
version: "1.0.0"
status: Draft
frozen: false
owner: Agent Team
philosophy:
  - Agent dung Resource cua Runtime (S015) - khong quan ly rieng.
  - Quota khai bao qua binding (A012 APB-004).
  - Khong Resource nao bi Leak.
  - Agent khong hardcode tai nguyen.
principles:
  - "Allocated: moi tai nguyen cap phat tuong minh (S015)."
  - "Released: giai phong tren Terminal State (S015)."
  - "Bounded: quota qua binding (A012)."
  - "Observable: quan sat qua S011 (S015)."
  - "Traceable: moi allocation truy vet (S015)."
categories:
  # note: Dung 10 categories cua S015 RS003.
  - Capability
  - Execution
  - Context
  - Memory
  - Storage
  - Compute
  - Network
  - Quota
  - Token
  - Time
resource_model:
  fields: [id, type, category, owner, status, capacity, allocated, quota, references, metadata]
lifecycle: [Draft, Available, Allocated, In Use, Released, Depleted]
allocation:
  - Request (agent execution)
  - Binding Check (A012 APB-004 -> POL-RES-001)
  - Allocate (S015 qua Runtime)
  - Bind to Agent
  - Track (S011)
access:
  - Request
  - Binding Check (A012 APB-010 -> POL-RESACC-001)
  - Grant / Deny
ownership:
  Agent Execution: Agent (qua Runtime S015)
  Quota: Agent Team (khai bao)
  Resource: Runtime (S015)
constraints:
  - Khong Double Allocation (S015).
  - Khong Resource Leak (S015).
  - Ton trong quota binding (A012).
  - Release tren Terminal State (S009).
registry_reference:
  - Resource dang ky trong Registry (S014).
  - Binding tham chieu policy (S012).
traceability:
  - Agent Execution
  - Allocation (S015)
  - Execution (S008)
  - Artifact
events:
  - AGENT_RESOURCE_ALLOCATED
  - AGENT_RESOURCE_RELEASED
  - AGENT_RESOURCE_EXHAUSTED
  - AGENT_RESOURCE_LEAKED
  - AGENT_RESOURCE_DENIED
  - AGENT_RESOURCE_QUEUED
metrics:
  agent_resource_allocations: 0
  agent_resource_releases: 0
  active_agent_resources: 0
  leak_count: 0
  exhaustion_count: 0
  quota_utilization: 0
  denied_count: 0
