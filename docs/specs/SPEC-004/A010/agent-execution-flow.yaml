# SPEC-004 A010 — Agent Execution Flow
# Agent chay qua Runtime (SPEC-001) + Workflow (SPEC-002) - System chi khai bao + dang ky + dieu phoi.
---
id: SPEC-004-A010
name: Agent Execution Flow
version: "1.0.0"
status: Draft
frozen: false
owner: Agent Team
philosophy:
  - Agent chay nhu Execution cua Runtime (SPEC-001).
  - Agent System khai bao + dang ky, Runtime thuc thi (AB004).
  - Dieu phoi qua Workflow (SPEC-002).
  - Khong buoc nao thieu Event (S011).
principles:
  - Declarative: Agent khai bao truoc, khong hardcode.
  - Validate truoc khi dang ky (AFR-006).
  - Register truoc khi chay (ANFR-003).
  - Delegate thuc thi cho Runtime (AB004).
  - Moi execution co trace + event (S011).
stages:
  note: Agent dung 7 stages cua S010 EF004 (qua Runtime).
  - Initialize
  - Validate
  - Prepare
  - Execute
  - Coordinate
  - Finalize
  - Complete
canonical_flow:
  - Command
  - Declare (metadata)
  - Validate
  - Register (S014 + Capability Mapping SPEC-003)
  - Orchestrate (Workflow SPEC-002 + Runtime SPEC-001)
  - Execute (Runtime S010)
  - Finalize
  - Complete
agent_flows:
  - Registration
  - Orchestration
  - Fallback
  - Gate (approval)
  - Retry (POL-RETRY-001)
  - Timeout (POL-TIMEOUT-001)
  - Failure (EF017)
rules:
  - Moi agent phai dang ky truoc khi chay (S014).
  - Moi execution chay qua Runtime - khong tu chay (AB004).
  - Moi buoc sinh Event + Trace + Metric (S011).
  - Gate can approval (S012 POL-APPROVAL-001).
  - Agent ket thuc bang Terminal State (S009).
