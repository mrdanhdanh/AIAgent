# SPEC-004 A010 - Agent Fallback Flow
---
version: "1.0.0"
flow:
  - Resolution Failed (S014 RG005A)
  - Kiem tra fallback list (khai bao)
  - Resolve fallback (qua Runtime)
  - Success -> dung fallback
  - Het fallback -> Failure (S009 ST-009)
rules:
  - Fallback khai bao truoc - khong hardcode.
  - Moi fallback sinh Event (S011).
