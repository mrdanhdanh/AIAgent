# SPEC-004 A020 - Agent Dashboard
# Dashboard chi doc (S011 OB010) - view tu machine-readable.
# Khong doc implementation. Khong ghi.
---
id: SPEC-004-A020
name: Agent Dashboard
version: "1.0.0"
status: Draft
frozen: false
owner: Agent Team
philosophy:
  - Agent Dashboard la mat quan sat Agent System.
  - Dashboard chi doc, khong ghi.
  - Dashboard khong doc implementation.
  - Moi view dung machine-readable.
principles:
  - Read Only
  - Machine-readable First (A011)
  - Event Driven (P005 - refresh theo event, khong polling)
  - Single File (A014 agent-registry-registry.yaml)
  - Least Privilege (S012 POL-SEC-001)
  - Immutable Views (view la projection, khong sua nguon)
scope:
  reads:
    - Agent Events (A011)
    - Agent Metrics (A011)
    - Agent Trace (A011)
    - Agent Audit (A011)
    - Health (A011)
    - Registry (A014)
    - Governance (A013)
    - Compliance (A016)
    - Doctor (A019)
  not_reads:
    - Implementation
    - Business Data
    - Agent Internal State
    - Plugin Internal State
views:
  - Agent View (state + outcome distribution A009/A010)
  - Definition View (definition version, binding A012)
  - Registry View (A014 agent-registry-registry.yaml)
  - Governance View (A013 - graph)
  - Resource View (A015 metrics)
  - Health View (A011 health + A016 score)
  - Compliance + Doctor View (A016 report + A019 report)
read_model:
  fields: [id, timestamp, agent_version, views, sources, refresh]
refresh:
  - Event Driven (P005): refresh khi co event moi.
  - Khong polling.
  - View la projection immutable (P010).
events:
  - AGENT_DASHBOARD_VIEWED
  - AGENT_DASHBOARD_REFRESHED
  - AGENT_DASHBOARD_ERROR
metrics:
  views_count: 0
  widgets_count: 0
  refresh_count: 0
  source_errors: 0
  avg_render_time: 0
