# SPEC-004 A017 - Agent Extensions
# Mo rong Agent System qua Contract (A007), dang ky Registry (S014).
# Khong sua Agent System core.
---
id: SPEC-004-A017
name: Agent Extensions
version: "1.0.0"
status: Draft
frozen: false
owner: Agent Team
philosophy:
  - Extension mo rong Agent System qua Contract (A007).
  - Extension khong sua Agent System core.
  - Moi Extension dang ky trong Registry (S014).
  - Extension chi truy cap qua Capability + Contract.
principles:
  - Contract First (A007)
  - Registry First (S014)
  - Isolated (S012 POL-ISOL-001)
  - Least Privilege (S012 POL-SEC-001)
  - Versioned (SemVer)
  - Verifiable (A016)
categories:
  - Agent Type Extension
  - Binding Extension (A012)
  - Mapping Extension (SPEC-003)
  - Orchestration Extension
  - Compatibility Extension
extension_model:
  fields: [id, name, version, category, status, owner, capabilities, contracts, dependencies, metadata]
lifecycle: [Draft, Published, Installed, Active, Disabled, Retired]
installation:
  - Register (S014 plugin-registry)
  - Validate (Contract A007 + Compatibility A013)
  - Install
  - Activate
activation_rules:
  - Contract hop le (A007).
  - Compatibility pass (A013).
  - Governance allow (A013).
  - Isolation dam bao (S012 POL-ISOL-001).
isolation:
  - Context isolated (S010 EF008).
  - Resource bounded (A015 quota).
  - Khong truy cap Agent Internal State (S011 OB003A).
  - Khong truy cap Extension khac (goi qua Contract).
security:
  - Permission qua POL-SEC-001 (S012).
  - Deny mac dinh (A013).
resources:
  - Extension owner resource (A015).
  - Quota rieng cho moi Extension.
compatibility:
  - Contract (A013)
  - Capability (A013)
  - Agent (A013)
  - Registry compatibility check (A014)
events:
  - AGENT_EXTENSION_REGISTERED
  - AGENT_EXTENSION_INSTALLED
  - AGENT_EXTENSION_ACTIVATED
  - AGENT_EXTENSION_DISABLED
  - AGENT_EXTENSION_FAILED
  - AGENT_EXTENSION_UNINSTALLED
metrics:
  active_extensions: 0
  installed_extensions: 0
  failed_extensions: 0
  extension_calls: 0
  extension_errors: 0
  avg_extension_latency: 0
