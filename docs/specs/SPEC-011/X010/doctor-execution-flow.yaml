version: "1.0.0"
stages:
  XF-001: { name: Request, description: Nhan request tu User/CLI, actor: Doctor, event: DOCTOR_REQUESTED }
  XF-002: { name: Scan, description: Scan toan bo he sinh thai, actor: ScanEngine, event: DOCTOR_SCANNING }
  XF-003: { name: Diagnose, description: Chan doan findings, actor: DiagnoseEngine, event: DOCTOR_DIAGNOSED }
  XF-004: { name: Score, description: Cham diem 0-100, actor: Scorer, event: DOCTOR_SCORED }
  XF-005: { name: Repair, description: Tu sua doc-only (optional), actor: RepairEngine, event: DOCTOR_STATE_REPAIRED }
  XF-006: { name: Report, description: Tao report markdown/JSON, actor: ReportEngine, event: DOCTOR_STATE_REPORTED }
source: /doctor command (Doctor khong dinh nghia lai pipeline)
