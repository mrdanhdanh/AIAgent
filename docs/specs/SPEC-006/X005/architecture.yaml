# SPEC-006 X005 — Context Architecture (Blueprint)
---
id: SPEC-006-X005
name: Context Architecture
version: "1.0.0"
status: Draft
frozen: false
owner: Context Team
vision: Lop quan ly Execution Context tren Runtime Kernel. Moi tang mot trach nhiem, giao tiep qua Contract.
decisions:
  - Context Engine la context management layer, khong phai Database.
  - Context transient - chi ton tai trong vong doi Execution.
  - Context luon isolated.
  - Context Engine thuc thi EF008 - khong dinh nghia lai flow.
layers:
  Command:
    level: 1
    domain: Execution
    input: Execution
    output: Context
    responsibility: [Nhan Context Request]
    not_responsibility: [Khong chua nghiep vu]
    invariant: Khong chua nghiep vu
    principle: P001
  Allocation:
    level: 2
    domain: Definition
    input: Execution
    output: Context
    responsibility: [Allocate Context khi Execution Created]
    not_responsibility: [Allocate ngoai Execution (XB001)]
    invariant: Allocate ngoai Execution (XB001)
    principle: P009
  Population:
    level: 3
    domain: Definition
    input: Execution
    output: Context
    responsibility: [Populate Context]
    not_responsibility: [Khong chua Business Data (XB006)]
    invariant: Khong chua Business Data (XB006)
    principle: P009
  Validation:
    level: 4
    domain: Validation
    input: Execution
    output: Context
    responsibility: [Validate Context truoc khi cap]
    not_responsibility: [Cap Context khong hop le (XB003)]
    invariant: Cap Context khong hop le (XB003)
    principle: P011
  Distribution:
    level: 5
    domain: Execution
    input: Execution
    output: Context
    responsibility: [Cap Context cho Agent/Capability]
    not_responsibility: [Cap truc tiep (XB004)]
    invariant: Cap truc tiep (XB004)
    principle: P002
  Collection:
    level: 6
    domain: Execution
    input: Execution
    output: Context
    responsibility: [Collect + Release Context]
    not_responsibility: [Giu Context sau ket thuc (XB007)]
    invariant: Giu Context sau ket thuc (XB007)
    principle: P009
  Publication:
    level: 7
    domain: Observability
    input: Execution
    output: Context
    responsibility: [Publish Event/Metrics/Trace/Audit (S011)]
    not_responsibility: [Khong chua Business Data]
    invariant: Khong chua Business Data
    principle: P014
domains:
  Definition: { owner: Context, business_logic: false }
  Validation: { owner: Context, business_logic: false }
  Execution: { owner: Runtime (SPEC-001), business_logic: false }
  Observability: { owner: Runtime (S011), business_logic: false }
dependency_rules:
  - "Layer N -> Layer N+1: duoc phep"
  - "Layer N -> Layer N+2: khong duoc phep"
  - "Khong Circular Dependency"
communication_rules:
  - Contract
  - Context
  - Event
  # note: Ngoai ra deu bi cam.
invariants:
  - Context luon Metadata Driven.
  - Context luon isolated.
  - Context luon Contract First.
  - Context luon Event Driven.
views:
  layer_view: [Command, Allocation, Population, Validation, Distribution, Collection, Publication]
  dependency_view: [Allocation, Population, Validation, Distribution, Collection]
  data_flow_view: [Context, Context Grant, Context Result]
  event_flow_view: [Context, Event, Metrics, Dashboard]
quality:
  Modularity: Cao
  Coupling: Thap
  Cohesion: Cao
  Extensibility: Rat cao
  Testability: Cao
  Determinism: "100%"
constraints:
  - Circular Dependency
  - Hidden Dependency
  - Shared Mutable State
  - Business Data trong Context
  - Shared Context
  # note: Tat ca deu CAM.
stability:
  stable: [Layers, Domains]
  evolvable: [Context Schema, Contracts]
  replaceable: [Context Store, Distribution Strategy]
metrics:
  layer_count: 7
  domain_count: 4
  circular_dependency: 0
validation:
  - Layering
  - Dependency
  - Coupling
  - Boundary Compliance (X004)
  - Principle Compliance
mapping:
  Layering: P008
  Contract: P002
  Event: P005
  Metadata: P003
  Constitution: P020
