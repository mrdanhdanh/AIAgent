# AIOS Governance Review Tracker — nguồn sự thật duy nhất.
# v2.0: TÁCH document.lifecycle (vòng đời tài liệu) khỏi review.status (trạng thái review).
# Mỗi mục: lifecycle thuộc trục Document (Draft→Review→Approved→Frozen→Deprecated→Archived),
#          review.status thuộc trục Review (NotReviewed→Rev1→Completed).
# Chỉ lệnh /review được phép cập nhật (append-only history). Schema: review.schema.json.
---
version: "2.0"
updated: "2026-08-07"

convention:
  review_ladder: [NotReviewed, Rev1, Completed]
  document_lifecycle: [Draft, Review, Approved, Frozen, Deprecated, Archived]
  min_reviews: 2
  review_types: [rev1, revfull, health, compliance, migration, regression]
  non_counting_types: [health]
  freeze_rule: "Completed → Approved → Frozen (không bao giờ trực tiếp)"

