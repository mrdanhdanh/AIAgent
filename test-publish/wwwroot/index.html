    <title>Japanese Learner</title>
    <script>
        (function() {
            var base = document.querySelector('base');
            if (!base) {
                base = document.createElement('base');
                document.head.appendChild(base);
            }
            var segments = window.location.pathname.split('/').filter(Boolean);
            if (segments.length >= 2) {
                base.href = '/' + segments.slice(0, 2).join('/') + '/';
            } else {
                base.href = '/';
            }
            var redirect = new URL(window.location.href).searchParams.get('redirect');
            var basePath = window.location.pathname.replace(/\/$/, '');
            if (redirect) {
                sessionStorage.setItem('redirect', redirect);
                history.replaceState(null, '', basePath + redirect);
            } else {
                var stored = sessionStorage.getItem('redirect');
                if (stored) {
                    sessionStorage.removeItem('redirect');
                    history.replaceState(null, '', basePath + stored);
                }
            }
        })();
    </script>

    <script>
        (function() {
            try {
                var stored = localStorage.getItem('japanese-learner-dark-mode');
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (parsed === true) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                }
            } catch(e) {}
        })();
    </script>
