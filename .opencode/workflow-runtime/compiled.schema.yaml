# Compiled Workflow Schema v1
# Compiled.workflow.json do compiler sinh (Phase 1.3). Runtime chỉ đọc file này, không đọc yaml.
# Reference: compiler.md, workflow.schema.yaml

type: object
required:
  - id
  - version
  - dag
  - execution_plan
  - cycle_free
  - entry_phase
properties:
  id:
    type: string
    description: nguồn workflow definition id
  workflow_version:
    type: string
  version:
    type: string
    default: '1'
  manifest:
    type: object
    properties:
      schema: { type: string }
      minimum_framework_version: { type: string }
      required_components:
        type: array
        items: { type: string }
      supported_capabilities:
        type: array
        items: { type: string }
  dag:
    type: object
    patternProperties:
      "^.*$":
        type: array
        items: { type: string }
        description: phase id phụ thuộc (dependency adjacency)
  execution_plan:
    type: array
    description: các step chạy theo thứ tự; mỗi step có thể chứa nhiều phase song song
    items:
      type: object
      required: [step]
      properties:
        step: { type: integer }
        phases:
          type: array
          items: { type: string }
  cycle_free:
    type: boolean
    description: bảo đảm true nếu compile thành công
  entry_phase:
    type: string
  phase_defs:
    type: object
    additionalProperties: true
    description: định nghĩa chi tiết từng phase (id → phase definition)
  compiled_at:
    type: string
  compiler_version:
    type: string