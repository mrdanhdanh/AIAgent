# governance.schema.yaml — Governance Engine Schema v1
version: "26.0"
schema: 1

type: object
required:
  - rules
properties:
  version: { type: string, const: "26.0" }
  rules:
    type: object
    properties:
      naming:
        type: object
        additionalProperties: { type: string }
      lifecycle:
        type: object
        properties:
          deprecated_requires_replacement: { type: boolean, default: true }
      approval:
        type: object
        additionalProperties: { type: string }
      security:
        type: object
        properties:
          plugin_signed: { type: boolean, default: true }
          secret_scan: { type: boolean, default: true }
  audit:
    type: array
    items:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string }
        actor: { type: string }
        action: { type: string }
        result: { type: string }