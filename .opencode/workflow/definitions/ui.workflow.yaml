# ui.workflow.yaml
# Workflow: ui-development (cải tiến UI/UX)
# Schema: workflow.schema.yaml v1

id: ui-development
version: "1"
description: UI/UX improvement workflow
manifest:
  schema: workflow.v1
  entry_phase: audit
  supported_capabilities:
    - review.ui
    - implementation.ui
    - test.e2e
    - security.audit
  required_components:
    - workflow-runtime
  minimum_framework_version: 4.0.0

phases:
  - id: audit
    name: UI Audit
    description: Đánh giá giao diện hiện tại
    capability: review.ui
    outputs: [audit.md]
    retry: 1

  - id: design
    name: UI Design
    description: Thiết kế cải tiến
    depends_on: [audit]
    capability: implementation.ui
    outputs: [design.md]
    retry: 1

  - id: implement
    name: UI Implement
    description: Triển khai UI
    depends_on: [design]
    capability: implementation.code
    outputs: [artifact.code]
    retry: 2

  - id: verify
    name: Verify
    description: Kiểm tra giao diện + accessibility
    depends_on: [implement]
    capability: test.e2e
    outputs: [verify.md]
    retry: 2

  - id: complete
    name: Complete
    description: Tổng kết
    depends_on: [verify]
    capability: review.documentation
    outputs: [summary.md]
    retry: 0