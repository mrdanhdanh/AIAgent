id: docs
name: Docs Workflow
version: 1.0.0
description: >
  Workflow cho cong viec tai lieu: phan tich, viet, review, validate va hoan tat.

phases:
  - id: analyze
    title: Phan tich tai lieu can viet
    description: Phan tich pham vi va noi dung tai lieu can tao/cap nhat.
    agent: analyst
    command: team-analyze
    depends_on: []
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs: {}
    outputs:
      status: string
      summary: string
      doc_scope: string
    expected_result: Hieu ro pham vi tai lieu.

  - id: write
    title: Viet tai lieu
    description: Viet hoac cap nhat tai lieu theo scope.
    agent: general
    depends_on: [analyze]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      analysis: object
    outputs:
      status: string
      artifacts:
        - string
    expected_result: File tai lieu duoc tao no-BOM, dung frontmatter.

  - id: review
    title: Review tai lieu
    description: Reviewer kiem tra noi dung va format tai lieu.
    agent: reviewer
    depends_on: [write]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      artifacts:
        - string
    outputs:
      status: string
      decision: string
      issues:
        - string
    expected_result: Tai lieu dung noi dung, frontmatter, code block balance.

  - id: validate
    title: Validate tai lieu
    description: Chay sync-system-docs de cap nhat docs he thong.
    agent: general
    command: team-syncdocs
    depends_on: [review]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      review_result: object
    outputs:
      status: string
      updated_files:
        - string
    expected_result: Docs he thong duoc dong bo, khong loi.

  - id: complete
    title: Hoan tat tai lieu
    description: Tong ket ket qua cong viec tai lieu.
    agent: general
    depends_on: [validate]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      validate_result: object
    outputs:
      status: string
      final_report: string
    expected_result: Workflow docs completed.
