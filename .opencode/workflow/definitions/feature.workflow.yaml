id: feature
name: Feature Workflow
version: 1.0.0
description: >
  Workflow trung binh cho phat trien tinh nang: phan tich, thiet ke, lap ke
  hoach, review, build, test, ui audit va hoan tat.

phases:
  - id: analyze
    title: Phan tich yeu cau tinh nang
    description: Phan tich yeu cau tinh nang moi.
    agent: analyst
    command: team-analyze
    depends_on: []
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs: {}
    outputs:
      status: string
      summary: string
      requirements:
        - string
    expected_result: Hieu ro tinh nang can xay dung.

  - id: design
    title: Thiet ke tinh nang
    description: Thiet ke kien truc cho tinh nang.
    agent: planner
    command: team-plan
    depends_on: [analyze]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      analysis: object
    outputs:
      status: string
      architecture: string
      components:
        - string
    expected_result: Thiet ke component ro rang.

  - id: plan
    title: Lap ke hoach thuc thi
    description: Lap ke hoach buoc thuc thi tinh nang.
    agent: planner
    command: team-plan
    depends_on: [design]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      design: object
    outputs:
      status: string
      steps:
        - order: int
          description: string
    expected_result: Ke hoach co it nhat 1 buoc.

  - id: review
    title: Danh gia ke hoach
    description: Reviewer danh gia ke hoach truoc khi build.
    agent: reviewer
    command: team-review
    depends_on: [plan]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      plan: object
    outputs:
      decision: string
      scores:
        overall: number
    expected_result: Quyet dinh APPROVED hoac CHANGES_REQUESTED.

  - id: build
    title: Thuc thi code
    description: Builder thuc hien cac buoc xay dung tinh nang.
    agent: builder
    command: team-build
    depends_on: [review]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      plan: object
    outputs:
      status: string
      changed_files:
        - string
      created_files:
        - string
    expected_result: Tinh nang duoc code theo plan, build pass.

  - id: test
    title: Chay kiem thu
    description: Tester chay test cho tinh nang moi.
    agent: tester
    command: team-test
    depends_on: [build]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      build_result: object
    outputs:
      status: string
      coverage:
        unit: number
    expected_result: Tat ca test PASS.

  - id: ui_audit
    title: Kiem tra giao dien
    description: Audit UI cua tinh nang moi.
    agent: ui-beautifier
    command: team-ui-audit
    depends_on: [test]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      app_path: string
    outputs:
      status: string
      phases:
        - string
    expected_result: Khong co CRITICAL/MAJOR issue.

  - id: complete
    title: Hoan tat tinh nang
    description: Tong ket ket qua phat trien tinh nang.
    agent: general
    depends_on: [ui_audit]
    retry: 3
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      ui_audit_result: object
    outputs:
      status: string
      final_report: string
    expected_result: Workflow feature completed.
