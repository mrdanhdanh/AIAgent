# feature.workflow.yaml
# Workflow: feature-development (chuan cho feature phat trien)
# Schema: workflow.schema.yaml v4.0 (engine v4) + manifest workflow.v1 (runtime v1)

id: feature-development
name: Feature Development Workflow
version: "1"
description: Standard feature development workflow - phan tich, thiet ke, review, backup, build, test, hoan tat.
manifest:
  schema: workflow.v1
  entry_phase: analyze
  supported_capabilities:
    - analysis.requirement
    - implementation.code
    - review.code
    - test.e2e
  required_components:
    - workflow-runtime
  minimum_framework_version: 4.0.0

phases:
  - id: analyze
    title: Phan tich yeu cau
    description: Phan tich yeu cau, xac dinh pham vi va rui ro.
    agent: analyst
    command: team-analyze
    capability: analysis.requirement
    depends_on: []
    retry: 1
    timeout_seconds: 120
    continue_on_error: false
    inputs: {}
    outputs:
      status: string
      summary: string
      requirements:
        - string
    expected_result: Hieu ro yeu cau va pham vi truoc khi thiet ke.
    optional: false

  - id: design
    title: Thiet ke giai phap
    description: Thiet ke kien truc va component cho giai phap.
    agent: planner
    command: team-plan
    capability: review.architecture
    depends_on: [analyze]
    retry: 1
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      analysis: object
    outputs:
      status: string
      architecture: string
      components:
        - string
    expected_result: Co thiet ke component, luong du lieu, security concerns.
    optional: false

  - id: review
    title: Danh gia ke hoach
    description: Reviewer danh gia ke hoach va dua quyet dinh.
    agent: reviewer
    command: team-review
    capability: review.code
    depends_on: [design]
    retry: 1
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      design: object
    outputs:
      status: string
      decision: string
      issues:
        - string
    expected_result: Quyet dinh APPROVED hoac CHANGES_REQUESTED ro rang.
    optional: false

  - id: backup
    title: Backup truoc khi thay doi
    description: Backup cac file cu truoc khi build theo plan.
    command: backup
    capability: ops.code
    depends_on: [review]
    retry: 2
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      plan: object
    outputs:
      status: string
      backup_workflow_id: string
    expected_result: Backup manifest duoc tao tai .opencode/backup/<WF-ID>/.
    optional: true

  - id: build
    title: Thuc hien code
    description: Builder thuc hien cac buoc thay doi code theo ke hoach.
    agent: builder
    command: team-build
    capability: implementation.code
    depends_on: [backup, review]
    retry: 2
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      plan: object
    outputs:
      status: string
      changed_files:
        - string
      created_files:
        - string
    expected_result: Cac thay doi dung theo plan, build pass.
    optional: false

  - id: test
    title: Chay kiem thu
    description: Tester chay unit + integration tests, bao cao coverage.
    agent: tester
    command: team-test
    capability: test.e2e
    depends_on: [build]
    retry: 2
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      build_result: object
    outputs:
      status: string
      coverage:
        unit: number
    expected_result: Tat ca test PASS, coverage >= nguong.
    optional: false

  - id: complete
    title: Tong ket workflow
    description: Tong hop ket qua va luu workflow.json snapshot.
    agent: general
    capability: review.code
    depends_on: [test]
    retry: 0
    timeout_seconds: 120
    continue_on_error: false
    inputs:
      all_outputs: object
    outputs:
      status: string
      final_report: string
    expected_result: Workflow completed, bao cao day du.
    optional: false
