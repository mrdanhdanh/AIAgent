<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Japanese Learner — ứng dụng học tiếng Nhật toàn diện: bảng chữ cái Hiragana, Katakana, từ vựng, Kanji và ngữ pháp N5." />
    <meta name="theme-color" content="#C5413B" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Japanese Learner" />
    <meta property="og:title" content="Japanese Learner — Học tiếng Nhật" />
    <meta property="og:description" content="Học Hiragana, Katakana, từ vựng, Kanji và ngữ pháp N5 qua flashcard, trắc nghiệm và luyện viết tay." />
    <meta property="og:image" content="icon-192.png" />
    <meta name="twitter:card" content="summary" />
    <title>Japanese Learner — Học tiếng Nhật</title>
    <base href="/" />
    <script>
        (function() {
            var redirect = new URL(window.location.href).searchParams.get('redirect');
            var basePath = window.location.pathname.replace(/\/$/, '');
            if (redirect) {
                sessionStorage.setItem('redirect', redirect);
                history.replaceState(null, '', basePath + redirect);
            } else {
                var stored = sessionStorage.getItem('redirect');
                if (stored) {
                    sessionStorage.removeItem('redirect');
                    history.replaceState(null, '', basePath + stored);
                }
            }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Outfit:wght@300..900&display=swap" rel="stylesheet" />
    <script>
        (function() {
            try {
                var stored = localStorage.getItem('japanese-learner-dark-mode');
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (parsed === true) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                }
            } catch(e) {}
        })();
    </script>
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="JapaneseLearner.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>

    <script src="js/handwriting.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
